<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body>

  <header>

    <!-- As a heading -->
    <nav class="navbar ">
      <div class="container-fluid bg-light  ">
        <span class="navbar-brand mb-0 h1 text-white ms-2 ms-md-5">Expens Tracker</span>
      </div>
    </nav>


  </header>

  <main>

    <!-- Alert -->
    <div class="alert" role="alert" style="display: none;"></div>

    <!-- spinner -->
    <div class="text-center mt-5" style="display: none;">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>



    <div class="container mt-4">

      <div class="row g-4 text-center">

        <!-- Total -->
        <div class="col-12 col-md-4">
          <div class="card rounded-4 h-100">
            <div class="card-body">
              <h5 class="card-title">Total</h5>
              <h2 id="totalAmount">0</h2>
            </div>
          </div>
        </div>

        <!-- Number of expenses -->
        <div class="col-12 col-md-4">
          <div class="card rounded-4 h-100">
            <div class="card-body">
              <h5 class="card-title">Number of expenses</h5>
              <h2 id="expenseCount">0</h2>
            </div>
          </div>
        </div>

        <!-- Highest expense -->
        <div class="col-12 col-md-4">
          <div class="card rounded-4 h-100">
            <div class="card-body">
              <h5 class="card-title">Highest expense</h5>
              <h2 id="highestAmount">0</h2>
              <small id="highestTitle"></small>
            </div>
          </div>
        </div>

      </div>

    </div>

 <div class="container mt-4">
    <div class="card rounded-4">
        <div class="card-body">

            <div class="row align-items-center">

                <!-- Title -->
                <div class="col-12 col-md-4 text-center">
                    <h5 class="card-title">Expenses by Category</h5>
                </div>

                <!-- Chart -->
                <div class="col-12 col-md-8">
                    <div style="height: 300px;">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<!-------------------------------------------------------------------->
    <div class="container mt-4">
      <div class="card border rounded-4">

        <div class="card-body">

          <div class="fw-bold">
            Add expense
          </div>

          <div class="row mt-4 g-3">

            <!-- Title -->
            <div class="col-12 col-md-4">
              <label for="title" class="form-label">Title</label>

              <input class="form-control" type="text" id="title" placeholder="Enter expense title">
            </div>


            <!-- Amount -->
            <div class="col-12 col-md-2">
              <label for="eamount" class="form-label">Amount</label>
              <input class="form-control" type="number" id="eamount" placeholder="Enter amount">
            </div>


            <!-- Category -->
            <div class="col-12 col-md-3">
              <label for="category" class="form-label">Category</label>

              <select id="category" class="form-select">

                <option selected disabled>Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>

              </select>
            </div>


            <!-- Date -->
            <div class="col-12 col-md-3">
              <label for="date" class="form-label">Date</label>

              <input class="form-control" type="date" id="date">
            </div>

          </div>


          <!-- Add Button -->
          <button id="addBtn" class="btn btn-success mt-5 mb-3">
            Add Expense
          </button>

        </div>
      </div>
    </div>






    <table class=" container table  border border-top-0 ">


      <!-- Table Title + Filter -->

      <div
        class="container  rounded-4 d-flex justify-content-between align-items-center mt-5 mb-0 pt-3 border border-bottom-0">
        <h5 class="fw-bold mb-3">Expenses</h5>

        <select id="categoryFilter" class="form-select w-auto">
          <option value="all">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>

        </select>
      </div>

      <thead>
        <!-- Expenses Table -->

        <tr class="  mt-5  pt-3">

          <th>Title</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="expenseTableBody" class="table-group-divider ">

        <!-- JavaScript will add rows here -->
      </tbody>
    </table>









    </div>


  </main>



  <script src="js/app2.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
